<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#ddd)}section{background:var(--card,#222);border-radius:var(--radius,10px);padding:12px;margin-bottom:12px}header{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:9px}h3{font-size:14px;margin:0}button{font:12px var(--font-sans,system-ui);padding:6px 10px;border:1px solid var(--border,#555);border-radius:5px;background:var(--secondary,#333);color:var(--foreground,#ddd);cursor:pointer}img{width:100%;height:auto;display:block;border-radius:4px}img[hidden]{display:none}p{font-size:13px;line-height:1.5;margin:0 0 12px;color:var(--muted-foreground,#999)}</style></head><body><p>Fresh backgrounds from dialogue and narration · No image inputs were used in generation. Existing sprites and UI are unchanged. Toggle each frame to compare the original pre-issue artwork.</p><section><header><h3>Reykjavik harbour</h3><button aria-pressed="false">Show original background</button></header><img class="after" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/dock-after.jpg" alt="Simplified dock background with existing sprites"><img class="before" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/dock-before.jpg" alt="Original background" hidden></section><section><header><h3>Boat bunk room</h3><button aria-pressed="false">Show original background</button></header><img class="after" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/bunk-after.jpg" alt="Simplified bunk background with existing sprites"><img class="before" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/bunk-before.jpg" alt="Original background" hidden></section><section><header><h3>Museum horn exhibit</h3><button aria-pressed="false">Show original background</button></header><img class="after" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/horn-after.jpg" alt="Simplified horn background with existing sprites"><img class="before" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/horn-before.jpg" alt="Original background" hidden></section><section><header><h3>Sauna · existing swimwear sprite</h3><button aria-pressed="false">Show original background</button></header><img class="after" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/sauna-after.jpg" alt="Simplified sauna background with existing sprites"><img class="before" src="/home/bestieboots/workspaces/seas-company/dev/issue-6/background-review/sauna-before.jpg" alt="Original background" hidden></section><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const s=b.closest('section'),original=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(original));s.querySelector('.before').hidden=!original;s.querySelector('.after').hidden=original;b.textContent=original?'Show updated background':'Show original background';});</script></body></html>
